name: email poll
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch email uploads from resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY not set yet — skipping"
            exit 0
          fi
          python3 resend_ingest.py
      - name: commit if changed
        run: |
          git config user.name bulkbot
          git config user.email actions@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "email upload [skip ci]" && git push)
